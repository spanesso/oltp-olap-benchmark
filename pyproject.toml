[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc311-bench"
version = "0.1.0"
description = "OLTP vs OLAP benchmark on NYC 311 Service Requests"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "duckdb>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: needs the docker PostgreSQL service and DuckDB",
    "loaded: runs against the currently loaded profile instead of the fixture",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
